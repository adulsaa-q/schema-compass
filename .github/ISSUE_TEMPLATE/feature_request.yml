name: 💡 Feature Request
description: Suggest an idea or architectural enhancement for schema-compass
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a new dialect adapter, AST safety rule, or graph optimization?
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or MCP tool enhancement you'd like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or workarounds you've considered.
