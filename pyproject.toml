[project]
name = "schema-compass"
version = "0.1.0"
description = "The Intelligent Database Schema Topology, Join-Path Solver, and AST Safety Gateway for AI Coding Agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2.0",
    "networkx>=3.7",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "sqlglot>=30.21.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
