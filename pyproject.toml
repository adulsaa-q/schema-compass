[project]
name = "schema-compass"
version = "0.1.0"
description = "The Intelligent Database Schema Topology, Join-Path Solver, and AST Safety Gateway for AI Coding Agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Adul Saa (Q)", email = "adulsaa.q@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "mcp>=2.2.0",
    "networkx>=3.7",
    "pydantic>=2.13.5",
    "sqlglot>=30.21.0",
]

[project.urls]
Homepage = "https://github.com/adulsaa-q/schema-compass"
Repository = "https://github.com/adulsaa-q/schema-compass"
Issues = "https://github.com/adulsaa-q/schema-compass/issues"
Documentation = "https://github.com/adulsaa-q/schema-compass#readme"

[project.scripts]
schema-compass = "schema_compass.server:main"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]


[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    ".skills",
    ".claude",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["networkx", "networkx.*"]
ignore_missing_imports = true
